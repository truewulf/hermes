# example configuration; copy to ~/.config/hermes/hermes.cfg to use it.
# options not present here keep their built-in defaults.

[child]
# by default hermes runs $SHELL, or /bin/sh if it is unset.
# program=/bin/mksh
# program=/usr/bin/bash --norc

[window]
# background opacity: 0 (transparent) to 255 (opaque)
opacity=255
# space around the terminal grid, in pixels
padding=0
# the surface always fills the compositor's window; unused pixels become margins
# server-side decorations: auto, yes or no
decorations=auto

[terminal]
# initial size in cells; the compositor may choose another size
rows=24
columns=80
# maximum number of lines in history (0 disables history)
scrollback=1000
# return to the bottom of history when typing: yes or no
scroll to bottom on input=no

[font]
# glyph height in pixels
size=18
# optional absolute path to a TrueType font; empty selects system monospace
# path=/usr/share/fonts/TTF/DejaVuSansMono.ttf
# missing symbols are looked up in other installed fonts

[bind]
# modifiers: C = control, S = shift, A = alt; key names are XKB keysyms
# these bindings override the matching built-in shortcuts
C-S-c=copy
C-S-v=paste
C-S-Page_Up=scroll up page
C-S-Page_Down=scroll down page
C-S-plus=zoom in
C-S-equal=zoom in
C-S-minus=zoom out
C-S-underscore=zoom out
C-S-r=zoom reset
# other available actions:
# reset, hard reset, scroll up, scroll down, scroll to top, scroll to bottom
# C-S-t=reset
# C-S-Delete=hard reset
# C-S-Home=scroll to top
# C-S-End=scroll to bottom

[colors]
# uncomment colors to override built-in defaults; use #RRGGBB
# foreground=#e6e1dc
# background=#060a07
# color0=#060a07
# color1=#da4939
# color2=#a5c261
# color3=#ffc66d
# color4=#6d9cbe
# color5=#b6b3eb
# color6=#519f50
# color7=#e6e1dc
# color8=#5a647e
# color9=#da6b5f
# color10=#abc277
# color11=#ffd99e
# color12=#94acbe
# color13=#d2d0eb
# color14=#6a9f69
# color15=#f9f4eb
